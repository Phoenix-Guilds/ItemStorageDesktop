<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>ItemStorage Console</title>

    <style>
      html,
      body {
        background: #121212;
        color: #d4d4d4;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      h3 {
        margin: 0;
        color: #007acc;
        font-weight: normal;
        flex-shrink: 0;
      }

      .app-header {
        flex-shrink: 0;
        padding: 15px 15px 10px;
      }

      .header-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .header-main h3 {
        font-size: 18px;
      }

      .header-subtitle {
        margin-top: 6px;
        color: #aaa;
        font-size: 13px;
      }

      #logs {
        flex-grow: 1;
        overflow-y: auto;
        border: 1px solid #333;
        margin: 0 15px 10px 15px;
        padding: 10px;
        background: #1e1e1e;
        font-family: "Consolas", "Monaco", monospace;
        font-size: 13px;
        border-radius: 4px;
        border-left: 3px solid #007acc;
        line-height: 1.5;
      }

      .log-success {
        color: #4caf50;
        font-weight: bold;
      }
      .log-error {
        color: #f44336;
      }
      .log-info {
        color: #4fc1ff;
      }
      .log-warn {
        color: #ce9178;
      }
      .log-update {
        color: #ff9800;
        background: rgba(255, 152, 0, 0.1);
        padding: 2px 4px;
        border-radius: 2px;
        display: block;
        margin: 5px 0;
      }

      .setup-panel {
        background: rgba(37, 37, 38, 0.98);
        padding: 15px;
        width: min(520px, calc(100% - 30px));
        margin: 0;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        box-sizing: border-box;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 15px;
        background: rgba(0, 0, 0, 0.65);
      }

      .path-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .path-row input {
        flex: 1;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        background: #3c3c3c;
        border: 1px solid #555;
        color: white;
        border-radius: 4px;
        box-sizing: border-box;
        outline: none;
      }

      input:focus {
        border-color: #007acc;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      button {
        background: #007acc;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
        transition: background 0.2s;
      }

      button:hover {
        background: #0062a3;
      }

      .info-text {
        font-size: 12px;
        color: #aaa;
        margin-bottom: 5px;
      }

      .small {
        padding: 8px 12px;
        font-size: 13px;
        background: #444;
      }

      .settings-button {
        margin: 0;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: #d4d4d4;
        font-size: 13px;
      }

      .checkbox-row input {
        width: auto;
        margin: 0;
      }

      .modal-actions {
        justify-content: flex-end;
      }
    </style>
  </head>

  <body>
    <header class="app-header">
      <div class="header-main">
        <h3>ItemStorageManager</h3>
        <button class="small settings-button" onclick="openSettings()">Настройки</button>
      </div>
      <div class="header-subtitle">События и синхронизация</div>
    </header>

    <div id="logs">Инициализация...</div>

    <div id="settings-modal" class="modal-backdrop">
      <div id="setup-panel" class="setup-panel">
      <h3 style="margin: 0 0 10px 0; font-size: 18px;">Настройка конфигурации</h3>

      <div id="setup-error" style="color: #ff6b6b; margin-bottom: 10px;"></div>

      <div id="path-section">
        <p class="info-text">Укажите путь к папке World of Warcraft:</p>

        <div class="path-row">
          <input type="text" id="game-path" placeholder="C:\Games\World of Warcraft" />

          <button class="small" onclick="chooseFolder()">
            Выбрать
          </button>
        </div>
      </div>

      <div id="token-section" style="display: none;">
        <p class="info-text">
          Введите GitHub Token (для режима администратора):
        </p>

        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxx" />

        <div style="margin-top: 8px;">
          <button onclick="useUserMode()" style="background: #555;">
            Использовать пользовательский режим
          </button>
        </div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="autostart-enabled" checked />
        Запускать программу вместе с Windows
      </label>

      <div class="actions">
        <button class="small" onclick="closeSettings()">Закрыть</button>
        <button onclick="saveSettings()">Сохранить</button>
      </div>
      </div>
    </div>

    <script>
      const { listen } = window.__TAURI__.event;
      const { invoke } = window.__TAURI__.core;

      const logsDiv = document.getElementById("logs");
      const settingsModal = document.getElementById("settings-modal");
      const tokenSection = document.getElementById("token-section");
      const pathSection = document.getElementById("path-section");
      const autostartCheckbox = document.getElementById("autostart-enabled");

      async function applyAutostart(enabled) {
        await invoke("set_autostart_preference", { enabled });
        await invoke(enabled ? "plugin:autostart|enable" : "plugin:autostart|disable");
      }

      async function initializeAutostart() {
        try {
          const enabled = await invoke("get_autostart_preference");
          autostartCheckbox.checked = enabled;
          await invoke(enabled ? "plugin:autostart|enable" : "plugin:autostart|disable");
        } catch (e) {
          console.error("Не удалось настроить автозапуск:", e);
        }
      }

      async function openSettings() {
        try {
          const settings = await invoke("get_settings");
          document.getElementById("game-path").value = settings.gamePath || "";
          document.getElementById("gh-token").value = settings.githubToken || "";
          autostartCheckbox.checked = settings.autostartEnabled;
          pathSection.style.display = "block";
          tokenSection.style.display = settings.forceUserMode ? "none" : "block";
          settingsModal.style.display = "flex";
        } catch (e) {
          showError(e);
        }
      }

      function closeSettings() {
        settingsModal.style.display = "none";
        document.getElementById("setup-error").textContent = "";
      }

      function showSetup() {
        settingsModal.style.display = "flex";
        pathSection.style.display = "block";
        document.getElementById("setup-error").textContent = "";
      }

      initializeAutostart();

      listen("log-event", (event) => {
        const msg = event.payload;
        if (!msg) return;

        const line = document.createElement("div");
        line.textContent = msg;

        if (msg.includes("[SUCCESS]") || msg.includes("[OK]")) {
          line.className = "log-success";
        } else if (msg.includes("[ERROR]") || msg.includes("[WARN]") || msg.includes("[!]")) {
          line.className = "log-error";
        } else if (msg.includes("[INFO]") || msg.includes("[SYNC]")) {
          line.className = "log-info";
        } else if (msg.includes("[UPDATE]")) {
          line.className = "log-update";
        }

        logsDiv.appendChild(line);
        logsDiv.scrollTop = logsDiv.scrollHeight;

        if (msg.includes("[NEED_SETUP]")) {
          showSetup();
          tokenSection.style.display = "none";
        }

        if (msg.includes("[NEED_SETUP_TOKEN]")) {
          showSetup();
          tokenSection.style.display = "block";
          pathSection.style.display = "none";
        }
      });

      // Функция для открытия диалога теперь берется из плагина корректно
      async function chooseFolder() {
        try {
          // В Tauri 2.0 команда требует обертки в ключ "options"
          const selected = await window.__TAURI__.core.invoke("plugin:dialog|open", {
            options: {
              title: "Выберите папку World of Warcraft",
              directory: true,
              multiple: false,
            },
          });

          if (selected) {
            // selected вернет строку с путем или null, если выбор отменен
            document.getElementById("game-path").value = selected;
          }
        } catch (e) {
          console.error("Ошибка при выборе папки:", e);
          alert("Не удалось открыть диалог: " + e);
        }
      }

      async function saveSettings() {
        const path = document.getElementById("game-path").value;
        const token = document.getElementById("gh-token").value;

        try {
          await invoke("update_settings", {
            path,
            token,
            userMode: false,
          });
          await applyAutostart(autostartCheckbox.checked);

          closeSettings();
          document.getElementById("setup-error").textContent = "";
        } catch (e) {
          showError(e);
        }
      }

      async function useUserMode() {
        const path = document.getElementById("game-path").value;

        try {
          await invoke("update_settings", {
            path,
            token: "",
            userMode: true,
          });
          await applyAutostart(autostartCheckbox.checked);

          closeSettings();
          document.getElementById("setup-error").textContent = "";
        } catch (e) {
          showError(e);
        }
      }

      function showError(e) {
        const errorBox = document.getElementById("setup-error");

        if (e === "INVALID_PATH") {
          errorBox.textContent = "❌ Неверный путь к папке WoW";
          return;
        }

        if (e === "INVALID_TOKEN") {
          errorBox.textContent = "❌ GitHub Token недействителен";
          tokenSection.style.display = "block";
          pathSection.style.display = "none";
          return;
        }

        errorBox.textContent = "Ошибка: " + e;
      }
    </script>
  </body>
</html>
